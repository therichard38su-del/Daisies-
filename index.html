<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De Ricky, para Isa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ocean-deep:#0F3352;
    --ocean-mid:#2E6E90;
    --ocean-light:#8FC7DE;
    --sand:#FBF3E2;
    --sand-deep:#F2E4C8;
    --coffee:#5B3A24;
    --coffee-light:#9C7148;
    --petal:#F9D65C;
    --petal-shadow:#E0B23C;
    --yolk:#8B4A18;
    --yolk-deep:#5E3410;
    --ink:#233B4D;
    --card-bg:#FFFCF5;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Quicksand',sans-serif;
    background:var(--sand);
    color:var(--ink);
    overflow:hidden;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --sand:#0F3352;
      --sand-deep:#0B2740;
      --card-bg:#153A57;
      --ink:#F2E4C8;
    }
  }
  :root[data-theme="dark"]{
    --sand:#0F3352;
    --sand-deep:#0B2740;
    --card-bg:#153A57;
    --ink:#F2E4C8;
  }

  #app{height:100%;position:relative;}
  .screen{
    display:none;
    height:100%;
    width:100%;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    position:relative;
  }
  .screen.active{display:flex;flex-direction:column;}

  /* ---------- COVER ---------- */
  #cover{
    background:linear-gradient(180deg,var(--ocean-deep) 0%,var(--ocean-mid) 55%,var(--ocean-light) 100%);
    justify-content:center;
    align-items:center;
    text-align:center;
    cursor:pointer;
    position:relative;
  }
  .cover-inner{
    position:relative;
    z-index:3;
    padding:0 8vw;
  }
  .cover-names{
    font-family:'Cormorant Garamond',serif;
    color:var(--sand);
    line-height:1;
  }
  .cover-de{
    display:block;
    font-size:clamp(1.1rem,4.5vw,1.6rem);
    font-style:italic;
    font-weight:500;
    letter-spacing:.08em;
    color:var(--ocean-light);
    margin-bottom:.2em;
    opacity:0;
    animation:riseIn 1.1s ease forwards;
    animation-delay:.2s;
  }
  .cover-ricky{
    display:block;
    font-size:clamp(2.6rem,13vw,4.6rem);
    font-weight:600;
    margin-bottom:.15em;
    opacity:0;
    animation:riseIn 1.1s ease forwards;
    animation-delay:.5s;
  }
  .cover-para{
    display:block;
    font-size:clamp(1.1rem,4.5vw,1.6rem);
    font-style:italic;
    font-weight:500;
    letter-spacing:.08em;
    color:var(--ocean-light);
    margin:.3em 0 .15em;
    opacity:0;
    animation:riseIn 1.1s ease forwards;
    animation-delay:.9s;
  }
  .cover-isa{
    display:block;
    font-size:clamp(3rem,15vw,5.4rem);
    font-weight:600;
    opacity:0;
    animation:riseIn 1.1s ease forwards;
    animation-delay:1.2s;
  }
  @keyframes riseIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  .cover-hint{
    margin-top:2.6em;
    font-size:.85rem;
    letter-spacing:.04em;
    color:var(--sand);
    opacity:0;
    animation:riseIn 1s ease forwards, floaty 2.4s ease-in-out infinite;
    animation-delay:1.8s,2.6s;
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(6px);}
  }
  .waves{
    position:absolute;
    left:0;right:0;bottom:0;
    width:100%;
    z-index:1;
    opacity:.55;
  }
  .waves path{animation:waveShift 9s ease-in-out infinite;}
  .waves path.w2{animation-duration:12s;animation-delay:-3s;}
  @keyframes waveShift{
    0%,100%{transform:translateX(0);}
    50%{transform:translateX(-3%);}
  }
  .float-icon{
    position:absolute;
    color:var(--sand);
    opacity:.18;
    z-index:2;
  }

  /* ---------- GARDEN ---------- */
  #garden{
    background:linear-gradient(180deg,var(--ocean-deep) 0%,var(--sand) 22%);
    align-items:center;
  }
  .garden-top{
    width:100%;
    text-align:center;
    padding:1.4rem 6vw .4rem;
  }
  .garden-title{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:clamp(1.2rem,5vw,1.6rem);
    color:var(--sand);
    margin:0 0 .5rem;
  }
  .progress{
    display:flex;
    justify-content:center;
    gap:.4rem;
    margin-bottom:.2rem;
  }
  .progress-dot{
    width:8px;height:8px;border-radius:50%;
    background:rgba(251,243,226,.35);
    transition:background .4s ease, transform .4s ease;
  }
  .progress-dot.found{
    background:var(--yolk);
    transform:scale(1.15);
  }

  .verse-panel{
    width:min(86vw,420px);
    margin:.8rem auto 0;
    background:var(--card-bg);
    border:1px solid var(--petal-shadow);
    border-radius:18px;
    padding:1rem 1.2rem;
    box-shadow:0 10px 24px rgba(15,51,82,.16);
    min-height:5.6rem;
    display:flex;
    flex-direction:column;
    justify-content:center;
    transition:opacity .35s ease, transform .35s ease;
  }
  .verse-panel.placeholder{
    color:var(--ocean-mid);
    font-style:italic;
    text-align:center;
    font-size:.92rem;
  }
  .verse-label{
    font-size:.72rem;
    letter-spacing:.03em;
    color:var(--ink);
    font-weight:700;
    margin-bottom:.3rem;
  }
  .verse-text{
    font-family:'Cormorant Garamond',serif;
    font-size:1.18rem;
    line-height:1.35;
    color:var(--ink);
    margin:0 0 .35rem;
  }
  .verse-ref{
    font-size:.78rem;
    color:var(--coffee-light);
    font-weight:600;
  }

  .hide-btn{
    display:inline-block;
    align-self:center;
    margin-top:.7rem;
    padding:.45rem 1.1rem;
    font-family:'Quicksand',sans-serif;
    font-size:.8rem;
    font-weight:600;
    letter-spacing:.02em;
    color:#0F3352;
    background:#FBF3E2;
    border:1px solid #8FC7DE;
    border-radius:999px;
    cursor:pointer;
    transition:transform .2s ease, background .2s ease;
  }
  .hide-btn:active{transform:scale(.96);}
  .hide-btn:hover{background:#ffffff;}

  .bouquet-wrap{
    position:relative;
    width:100%;
    max-width:480px;
    flex:1;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:1.4rem 0 0;
    min-height:270px;
  }
  .deco-icon{position:absolute;opacity:.32;color:var(--coffee-light);}
  .bouquet{
    position:relative;
    width:88%;
    height:100%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .flower-unit{
    position:absolute;
    bottom:34px;
    width:64px;
    transform-origin:50% 100%;
  }
  .stem{
    position:absolute;
    left:50%;
    bottom:0;
    width:3px;
    margin-left:-1.5px;
    background:linear-gradient(180deg,#5C8A57,#3E6B3B);
    border-radius:3px;
  }
  .ribbon{
    position:absolute;
    bottom:6px;
    left:50%;
    transform:translateX(-50%);
    width:64px;
    height:34px;
    z-index:2;
  }

  .daisy{
    position:absolute;
    left:50%;
    margin-left:-32px;
    width:64px;
    height:64px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .daisy .bud{
    position:absolute;
    left:50%;top:50%;
    width:13px;height:22px;
    background:linear-gradient(180deg,#EFE7CF,#DDD0AA);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    transform:translate(-50%,-50%) rotate(0deg);
    transition:opacity .4s ease, transform .4s ease;
    box-shadow:inset 0 -3px 4px rgba(0,0,0,.08);
  }
  .daisy.open .bud{opacity:0;transform:translate(-50%,-50%) scale(.3);}

  .bloom{
    position:absolute;
    left:50%;top:50%;
    width:0;height:0;
  }
  .petal{
    position:absolute;
    left:0;top:0;
    width:11px;height:26px;
    margin:-26px 0 0 -5.5px;
    background:var(--petal);
    border-radius:60% 60% 45% 45%;
    box-shadow:0 1px 2px rgba(90,70,30,.15);
    transform-origin:50% 100%;
    transform:rotate(calc(var(--i) * 45deg)) scale(.15);
    opacity:0;
    transition:transform .55s cubic-bezier(.34,1.56,.64,1), opacity .4s ease;
    transition-delay:calc(var(--i) * 45ms);
  }
  .daisy.open .petal{
    transform:rotate(calc(var(--i) * 45deg)) scale(1);
    opacity:1;
  }
  .center{
    position:absolute;
    left:0;top:0;
    width:16px;height:16px;
    margin:-8px 0 0 -8px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--yolk),var(--yolk-deep));
    transform:scale(.15);
    opacity:0;
    transition:transform .5s ease .25s, opacity .4s ease .25s;
    box-shadow:0 1px 3px rgba(90,60,10,.25);
  }
  .daisy.open .center{transform:scale(1);opacity:1;}

  .daisy::after{
    content:'';
    position:absolute;
    inset:-10px;
  }

  .footer-msgs{
    width:100%;
    text-align:center;
    padding:1.6rem 6vw calc(2.2rem + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,rgba(251,243,226,0),var(--sand-deep) 40%);
  }
  .footer-line1{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(1.5rem,7vw,2.1rem);
    color:var(--ocean-deep);
    margin:0 0 .3rem;
  }
  .footer-line2{
    font-size:.95rem;
    letter-spacing:.02em;
    color:var(--coffee);
    font-weight:600;
    margin:0;
  }
  .footer-heart{
    color:var(--yolk-deep);
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- COVER SCREEN -->
  <div id="cover" class="screen active" role="button" tabindex="0" aria-label="Toca para abrir tu regalo">
    <svg class="waves" viewBox="0 0 500 90" preserveAspectRatio="none" style="height:16vh;">
      <path class="w2" d="M0,50 C80,20 160,80 250,50 C340,20 420,80 500,50 L500,90 L0,90 Z" fill="#8FC7DE" opacity=".5"/>
      <path d="M0,60 C90,30 170,90 260,60 C350,30 430,90 500,60 L500,90 L0,90 Z" fill="#FBF3E2" opacity=".9"/>
    </svg>

    <div class="float-icon" style="top:12%;left:9%;" aria-hidden="true">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 4h9a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4V4z"/><path d="M20 4v16"/></svg>
    </div>
    <div class="float-icon" style="top:22%;right:10%;" aria-hidden="true">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 8h13v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8z"/><path d="M16 10h2a2 2 0 0 1 0 4h-2"/><path d="M6 2c0 1-1 1-1 2s1 1 1 2M10 2c0 1-1 1-1 2s1 1 1 2"/></svg>
    </div>
    <div class="float-icon" style="bottom:22%;left:18%;" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="18" r="3"/><path d="M9 18V4l10-2v13"/><circle cx="16" cy="15" r="3"/></svg>
    </div>

    <div class="cover-inner">
      <p class="cover-names">
        <span class="cover-de">de</span>
        <span class="cover-ricky">Ricky</span>
        <span class="cover-para">para</span>
        <span class="cover-isa">Isa</span>
      </p>
      <p class="cover-hint">toca para abrir 🌊</p>
    </div>
  </div>

  <!-- GARDEN SCREEN -->
  <div id="garden" class="screen">
    <div class="garden-top">
      <p class="garden-title">un ramo solo para ti</p>
      <div class="progress" id="progress"></div>
      <div class="verse-panel placeholder" id="versePanel">toca cada margarita para descubrir su versículo 🌼</div>
    </div>

    <div class="bouquet-wrap">
      <svg class="deco-icon" style="width:54px;height:54px;top:4%;left:4%;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 4h9a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4V4z"/><path d="M20 4v16"/></svg>
      <svg class="deco-icon" style="width:46px;height:46px;top:8%;right:5%;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 8h13v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8z"/><path d="M16 10h2a2 2 0 0 1 0 4h-2"/></svg>
      <div class="bouquet" id="bouquet"></div>
    </div>

    <div class="footer-msgs">
      <p class="footer-line1">Dios te ama, Isa <span class="footer-heart">♡</span></p>
      <p class="footer-line2">sos muy especial</p>
    </div>
  </div>

</div>

<script>
(function(){
  var verses = [
    {label:"Lo estás haciendo bien", text:"No nos cansemos de hacer el bien, que a su tiempo cosecharemos si no desmayamos.", ref:"Gálatas 6:9"},
    {label:"Dios siempre está contigo", text:"Esfuérzate y sé valiente, porque el Señor tu Dios estará contigo dondequiera que vayas.", ref:"Josué 1:9"},
    {label:"Para tus batallas", text:"El caballo se alista para el día de la batalla, mas la victoria es del Señor.", ref:"Proverbios 21:31"},
    {label:"Mujer virtuosa", text:"Mujer virtuosa, ¿quién la hallará? Su valor supera al de las piedras preciosas.", ref:"Proverbios 31:10"},
    {label:"Planes de bien para ti", text:"Yo sé los planes que tengo para ti: planes de bienestar, para darte un futuro y una esperanza.", ref:"Jeremías 29:11"},
    {label:"Su alegría eres tú", text:"El Señor tu Dios está en medio de ti; se goza en ti con alegría y te renueva con su amor.", ref:"Sofonías 3:17"}
  ];

  // layout positions (left%, bottom-height for stem length, rotation)
  var layout = [
    {x:18, h:118, rot:-10},
    {x:34, h:150, rot:-5},
    {x:50, h:172, rot:0},
    {x:66, h:150, rot:5},
    {x:82, h:118, rot:10},
    {x:50, h:132, rot:0}
  ];

  var bouquet = document.getElementById('bouquet');
  var progressWrap = document.getElementById('progress');
  var versePanel = document.getElementById('versePanel');
  var found = {};
  var allDaisies = [];

  var hideBtn = document.createElement('button');
  hideBtn.type = 'button';
  hideBtn.className = 'hide-btn';
  hideBtn.textContent = 'esconder ramo';

  // ribbon
  var ribbon = document.createElement('div');
  ribbon.className = 'ribbon';
  ribbon.innerHTML = '<svg viewBox="0 0 64 34" width="64" height="34"><path d="M2 6 L32 2 L62 6 L58 30 L32 20 L6 30 Z" fill="#2E6E90" opacity="0.85"/><ellipse cx="32" cy="16" rx="7" ry="6" fill="#0F3352"/></svg>';
  bouquet.appendChild(ribbon);

  layout.forEach(function(pos, i){
    var unit = document.createElement('div');
    unit.className = 'flower-unit';
    unit.style.left = 'calc(' + pos.x + '% - 32px)';
    unit.style.height = (pos.h + 32) + 'px';
    unit.style.transform = 'rotate(' + pos.rot + 'deg)';
    bouquet.appendChild(unit);

    var stem = document.createElement('div');
    stem.className = 'stem';
    stem.style.height = pos.h + 'px';
    unit.appendChild(stem);

    var daisy = document.createElement('div');
    daisy.className = 'daisy';
    daisy.style.bottom = (pos.h - 32) + 'px';
    daisy.setAttribute('role','button');
    daisy.setAttribute('tabindex','0');
    daisy.setAttribute('aria-label','Margarita ' + (i+1) + ', toca para leer su versículo');

    var bud = document.createElement('div');
    bud.className = 'bud';
    daisy.appendChild(bud);

    var bloom = document.createElement('div');
    bloom.className = 'bloom';
    for (var p = 0; p < 8; p++){
      var petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.setProperty('--i', p);
      bloom.appendChild(petal);
    }
    var center = document.createElement('div');
    center.className = 'center';
    bloom.appendChild(center);
    daisy.appendChild(bloom);

    var progressDot = document.createElement('div');
    progressDot.className = 'progress-dot';
    progressWrap.appendChild(progressDot);

    function reveal(){
      daisy.classList.add('open');
      if (!found[i]){
        found[i] = true;
        progressDot.classList.add('found');
      }
      var v = verses[i];
      versePanel.classList.remove('placeholder');
      versePanel.style.opacity = '0';
      setTimeout(function(){
        versePanel.innerHTML =
          '<div class="verse-label">' + v.label + '</div>' +
          '<p class="verse-text">"' + v.text + '"</p>' +
          '<div class="verse-ref">' + v.ref + '</div>';
        if (Object.keys(found).length === layout.length){
          versePanel.appendChild(hideBtn);
        }
        versePanel.style.opacity = '1';
      }, 150);
    }

    daisy.addEventListener('click', reveal);
    daisy.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); reveal(); }
    });

    unit.appendChild(daisy);
    allDaisies.push(daisy);
  });

  hideBtn.addEventListener('click', function(){
    allDaisies.forEach(function(d){ d.classList.remove('open'); });
    versePanel.classList.add('placeholder');
    versePanel.style.opacity = '0';
    setTimeout(function(){
      versePanel.innerHTML = 'toca cada margarita para descubrir su versículo 🌼';
      versePanel.style.opacity = '1';
    }, 150);
  });

  // screen transition
  var cover = document.getElementById('cover');
  var garden = document.getElementById('garden');
  function openGarden(){
    cover.classList.remove('active');
    garden.classList.add('active');
  }
  cover.addEventListener('click', openGarden);
  cover.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openGarden(); }
  });
})();
</script>
</body>
</html>
